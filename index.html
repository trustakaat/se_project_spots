<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="James Clark"/><meta name="description" content="A responsive web application where users can like, and upload photos."/><title>Spot</title><link rel="icon" href="favicon.ico" type="image/x-icon"/><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body class="page"><header class="header"><nav class="nav"><img src="8650253b58b46f0f1c06.svg" alt="Spots Logo" class="nav__logo"/></nav></header><main class="content"><section class="profile"><img src="2fc47fd8e9a9bcd9612f.jpg" alt="Bessie Coleman" class="profile__image"/><div class="profile__text"><h1 class="profile__user-name">Bessie Coleman</h1><p class="profile__user-info">Civil Aviator</p><button class="profile__edit-btn"><img src="1ecf96fab54a91c898b4.svg" alt="" class="profile__edit-icon"/> Edit Profile</button></div><button class="profile__btn"><img src="40608da7369d39bc1077.svg" alt="" class="profile__btn-image"/> New Post</button></section><section class="cards"><ul class="cards__list"><template id="card__template"><li class="card"><button class="card__delete-btn" type="button"></button> <img src="" alt="" class="card__image"/><div class="card__description"><h2 class="card__text"></h2><button class="card__btn"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2025 © Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" name="editProfileForm" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" required aria-required="true" maxlength="40" minlength="2"/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" required aria-required="true" maxlength="200" minlength="2"/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__save-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-btn"></button><h2 class="modal__title">New post</h2><form class="modal__form" name="newPostForm" novalidate><label for="post-image-input" class="modal__label">Image link <input id="post-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required aria-required="true"/> <span id="post-image-input-error" class="modal__error"></span></label> <label for="new-post-caption-input" class="modal__label">Caption <input id="new-post-caption-input" class="modal__input" placeholder="Type your caption" required aria-required="true" maxlength="30" minlength="2"/> <span id="new-post-caption-input-error" class="modal__error"></span></label> <button type="submit" class="modal__save-btn">Save</button></form></div></div><div class="modal" id="preview-modal"><div class="modal__image-container"><button type="button" class="modal__close-btn modal__close-btn_type_preview"></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div></body></html>
